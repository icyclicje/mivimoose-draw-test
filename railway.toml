[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node server/scripts/railway-start.mjs"
healthcheckPath = "/api/health"
# Generous: a cold volume means the first boot downloads GloVe (~250MB) and
# builds the 200k-word index, which can take several minutes on a small
# instance. Later deploys read the cached index off the volume and start in
# seconds.
healthcheckTimeout = 900
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
